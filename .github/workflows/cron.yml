name: Production Reminders Cron Trigger

on:
  schedule:
    # Trigger every 5 minutes (standard GitHub Actions scheduled cron)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-cron:
    name: Dispatch Due Reminders
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron
        run: |
          TARGET_URL="${{ secrets.PROD_CRON_URL || 'https://insuminder.pages.dev/api/cron' }}"
          echo "Pinging production cron endpoint: $TARGET_URL"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$TARGET_URL" || true)
          echo "$RESPONSE"

