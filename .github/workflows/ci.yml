name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, 'feat/*', 'feature/*', 'fix/*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Parity Check
    # Runner infrastructure: pinned to ubuntu-24.04 with forward readiness for ubuntu-26.04
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js (Node 22 Active LTS)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Run ESLint
        run: npm --prefix client run lint

      - name: Check Multilingual (HE & RU) Translation Parity
        run: npm --prefix client run check:i18n

      - name: Check Theme (Dark & Light) Consistency & Parity
        run: npm --prefix client run check:theme

      - name: Check for Hardcoded Secrets & Sensitive Credentials (Rule 13)
        run: node scripts/check-secrets.js

      - name: Check Application Version Synchronization & Parity
        run: node scripts/check-version.js

      - name: Check Cloudflare Functions Parity
        run: git diff --no-index --exit-code functions/ client/functions/

  build:
    name: JS Compilation & Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js (Node 22 Active LTS)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Build Client (Vite)
        run: npm --prefix client run build

      - name: Build Cloudflare Pages Functions
        run: npx wrangler pages functions build functions

  test:
    name: Automated Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js (Node 22 Active LTS)
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Run Server Tests
        run: npm --prefix server test

      - name: Run Client Tests
        run: npm --prefix client test
