plugins {
    id 'com.android.application'
}

android {
    namespace 'com.insuminder.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.insuminder.app"
        minSdk 24
        targetSdk 35
        versionCode 13
        versionName "1.9.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("insuminder.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "insuminder"
            keyAlias System.getenv("KEY_ALIAS") ?: "insuminder"
            keyPassword System.getenv("KEY_PASSWORD") ?: "insuminder"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}

