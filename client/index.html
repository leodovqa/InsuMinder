<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InsuMinder</title>

    <!-- Social & Open Graph Metadata for URL entry and sharing -->
    <meta property="og:title" content="InsuMinder - Insulin Timing & Reminders" />
    <meta property="og:description" content="A smart, safe, and automated insulin injection tracker & reminder platform." />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="InsuMinder" />
    <meta name="twitter:description" content="A smart, safe, and automated insulin injection tracker & reminder platform." />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Instant Launch Splash Styling (displays immediately while app scripts load) -->
    <style>
      body {
        margin: 0;
        background-color: #0b1120;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .app-initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 35%, #0f1d36 0%, #080d1a 100%);
        z-index: 99999;
      }
      .splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        animation: splashFadeIn 0.35s ease-out;
      }
      .splash-app-icon {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 10px 30px rgba(14, 165, 233, 0.4), 0 0 20px rgba(14, 165, 233, 0.25);
        animation: splashPulse 2s infinite ease-in-out;
      }
      .splash-app-name {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
        color: #f1f5f9;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #ffffff 0%, #bae6fd 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .splash-loader-bar {
        width: 140px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 6px;
      }
      .splash-loader-progress {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #0284c7, #38bdf8, #0284c7);
        border-radius: 999px;
        animation: splashProgress 1.4s infinite ease-in-out;
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(14, 165, 233, 0.4); }
        50% { transform: scale(1.04); box-shadow: 0 14px 40px rgba(14, 165, 233, 0.6); }
      }
      @keyframes splashProgress {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(20%); }
        100% { transform: translateX(100%); }
      }
      @keyframes splashFadeIn {
        from { opacity: 0; transform: scale(0.92); }
        to { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- High-Performance Instant Brand Splash Screen (visible immediately upon entering URL) -->
      <div id="initial-splash" class="app-initial-splash">
        <div class="splash-card">
          <img src="/icons/icon-192x192.png" alt="InsuMinder" class="splash-app-icon" width="96" height="96" />
          <h1 class="splash-app-name">InsuMinder</h1>
          <div class="splash-loader-bar">
            <div class="splash-loader-progress"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
